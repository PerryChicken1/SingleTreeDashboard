<body><svg id="chart" viewBox="0 0 900 390" role="img"></svg><script>
const W=900,H=390,M={top:35,right:25,bottom:90,left:62},svg=document.getElementById("chart"),NS="http://www.w3.org/2000/svg";let labels=[],actual=[],desired=[],tolerances=[],axisTitle="",drag=-1,mode="desired",configuration="";
